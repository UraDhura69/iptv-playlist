name: Auto Update YOLO m3u8

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Download Latest YOLO
        run: curl -L "https://raw.githubusercontent.com/UraDhura69/iptv-playlist/main/YOLO.m3u8" -o YOLO.m3u8

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add YOLO.m3u8
          git commit -m "auto update YOLO" || echo "no changes"
          git push
